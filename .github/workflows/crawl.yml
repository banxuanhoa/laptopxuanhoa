name: Crawl Zalo

on:
  schedule:
    - cron: "0 */24 * * *"   # chạy mỗi 6 giờ
  workflow_dispatch:        # cho phép chạy tay

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Cài NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cài puppeteer
        run: npm install puppeteer

      - name: Chạy crawl
        run: node crawl.js

      - name: Commit file JSON
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add products.json
          git commit -m "update data" || echo "No change"
          git push
